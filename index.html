<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.👻 BekEs | بيكاس :</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050c;
  --text:#eef2ff;
  --muted:#7d87a8;
  --c1:#6366f1;
  --c2:#a855f7;
  --c3:#ec4899;
  --green1:#22c55e;
  --green2:#10b981;
  --stroke:rgba(255,255,255,0.08);
  --radius:22px;
  --radius-sm:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Tajawal',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;
  overflow-x:hidden;line-height:1.65;
  -webkit-font-smoothing:antialiased;position:relative;
}

/* ===== الخلفيات ===== */
.bg-grid{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 100% 70% at 50% 0%,#000 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 100% 70% at 50% 0%,#000 30%,transparent 80%);
}
.aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aurora::before,.aurora::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.aurora::before{
  width:700px;height:700px;top:-280px;right:-200px;
  background:radial-gradient(circle,var(--c1),transparent 60%);
  animation:drift1 20s ease-in-out infinite;
}
.aurora::after{
  width:600px;height:600px;bottom:-250px;left:-150px;
  background:radial-gradient(circle,var(--c3),transparent 60%);
  animation:drift2 24s ease-in-out infinite;
}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,60px) scale(1.1)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-50px) scale(1.15)}}

/* ===== الهيدر ===== */
.header{padding:20px 24px;position:relative;z-index:10;display:flex;justify-content:center}
.header-inner{
  width:100%;max-width:1200px;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--stroke);
  border-radius:18px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));
  display:grid;place-items:center;
  box-shadow:0 8px 24px -8px rgba(168,85,247,0.7),inset 0 1px 0 rgba(255,255,255,0.3);
  position:relative;overflow:hidden;flex:none;
}
.brand-icon svg{width:22px;height:22px;fill:#fff;position:relative;z-index:1}
.brand-icon::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.35),transparent 70%);
  transform:translateX(-100%);animation:shine 3s infinite;
}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.brand-name{font-size:1.3rem;font-weight:800;letter-spacing:-0.5px;color:#fff}
.brand-accent{
  background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.header-badge{
  font-size:0.72rem;font-weight:700;padding:5px 12px;border-radius:999px;
  background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);
  color:#a5b4fc;letter-spacing:0.5px;
}

/* ===== الرئيسي ===== */
.main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:30px 24px 60px}
.hero{text-align:center;margin-bottom:36px;padding:0 16px}
.hero h1{
  font-size:clamp(1.5rem,3.5vw,2.2rem);font-weight:800;letter-spacing:-0.5px;
  background:linear-gradient(135deg,#fff 20%,#c7d2fe 60%,#e9d5ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:8px;line-height:1.3;
}
.hero p{font-size:0.95rem;color:var(--muted)}

/* ===== الشبكة ===== */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:880px){.grid{grid-template-columns:1fr}}

/* ===== البطاقة ===== */
.card{
  background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.015));
  border:1px solid var(--stroke);border-radius:var(--radius);
  padding:24px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 24px 60px -30px rgba(0,0,0,0.9),inset 0 1px 0 rgba(255,255,255,0.06);
  position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:0;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,0.5),transparent);
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--stroke);
}
.card-head h2{font-size:1.05rem;font-weight:800;color:#fff}
.status{
  font-size:0.72rem;font-weight:700;padding:4px 12px;border-radius:999px;
  background:rgba(255,255,255,0.04);border:1px solid var(--stroke);
  color:var(--muted);transition:0.3s;white-space:nowrap;
}
.status.ok{
  background:rgba(16,185,129,0.12);border-color:rgba(16,185,129,0.4);
  color:#6ee7b7;box-shadow:0 0 20px -4px rgba(16,185,129,0.5);
}

/* ===== النموذج ===== */
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:0.82rem;font-weight:700;color:#b8c1dc;margin-bottom:7px}
.field input{
  width:100%;padding:13px 15px;border-radius:var(--radius-sm);
  background:rgba(5,7,15,0.6);border:1px solid var(--stroke);
  color:var(--text);font-family:inherit;font-size:0.92rem;
  outline:none;transition:0.2s;min-width:0;
}
.field input::placeholder{color:#4a5470}
.field input:focus{
  border-color:rgba(139,92,246,0.8);
  background:rgba(5,7,15,0.85);
  box-shadow:0 0 0 4px rgba(139,92,246,0.12);
}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:520px){.field-row{grid-template-columns:1fr}}

/* ===== الأزرار ===== */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:14px 18px;border-radius:var(--radius-sm);
  border:1px solid transparent;font-family:inherit;font-size:0.95rem;
  font-weight:800;cursor:pointer;text-decoration:none;
  transition:0.2s;position:relative;overflow:hidden;user-select:none;
}
.btn svg{width:19px;height:19px;fill:currentColor;flex:none}
.btn:active{transform:scale(0.98)}
.btn-install{
  background:linear-gradient(135deg,var(--green1),var(--green2));
  color:#02110a;margin-bottom:6px;
  box-shadow:0 12px 30px -12px rgba(16,185,129,0.8),inset 0 1px 0 rgba(255,255,255,0.3);
}
.btn-install::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.4),transparent 70%);
  transform:translateX(-100%);
}
.btn-install:hover::after{animation:shine 0.8s ease}
.btn-ipa{
  background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(168,85,247,0.2));
  color:#c7d2fe;border-color:rgba(139,92,246,0.4);
}
.btn-ipa:hover{
  background:linear-gradient(135deg,rgba(99,102,241,0.35),rgba(168,85,247,0.35));
  border-color:rgba(139,92,246,0.7);
}
.btn.disabled{opacity:0.4;pointer-events:none;filter:grayscale(0.6)}
.btn-hint{text-align:center;font-size:0.72rem;color:var(--muted);margin-bottom:14px}

/* ===== الفاصل ===== */
.divider{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--stroke),transparent);
  margin:18px 0;
}

/* ===== رابط التثبيت ===== */
.link-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;font-size:0.82rem;font-weight:700;color:#b8c1dc;
}
.copy-btn{
  width:32px;height:32px;border-radius:9px;
  background:rgba(255,255,255,0.05);border:1px solid var(--stroke);
  color:#c3cde6;cursor:pointer;display:grid;place-items:center;transition:0.2s;flex:none;
}
.copy-btn:hover{
  background:rgba(139,92,246,0.25);
  border-color:rgba(139,92,246,0.5);color:#fff;
}
.copy-btn svg{width:14px;height:14px;fill:currentColor}
.link-input{
  width:100%;padding:11px 14px;border-radius:var(--radius-sm);
  background:rgba(5,7,15,0.6);border:1px solid var(--stroke);
  color:#a5b0d0;font-size:0.78rem;
  font-family:ui-monospace,Menlo,monospace;
  direction:ltr;text-align:left;outline:none;
  overflow:hidden;text-overflow:ellipsis;
}
.link-input:focus{border-color:rgba(139,92,246,0.6)}

/* ===== الكود ===== */
.code-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;font-size:0.82rem;font-weight:700;color:#b8c1dc;
}
.code-tools{display:flex;gap:6px}
.chip-btn{
  font-family:inherit;font-size:0.72rem;font-weight:700;
  padding:6px 12px;border-radius:9px;
  background:rgba(255,255,255,0.05);border:1px solid var(--stroke);
  color:#c3cde6;cursor:pointer;transition:0.2s;
}
.chip-btn:hover{
  background:rgba(139,92,246,0.2);
  border-color:rgba(139,92,246,0.5);color:#fff;
}
.chip-btn.disabled{opacity:0.4;pointer-events:none}
.code{
  padding:14px;border-radius:var(--radius-sm);
  background:rgba(2,3,9,0.7);border:1px solid var(--stroke);
  font-family:ui-monospace,Menlo,monospace;
  font-size:0.72rem;line-height:1.7;color:#a5b0d0;
  direction:ltr;text-align:left;white-space:pre;
  overflow:auto;max-height:260px;margin:0;
}
.code::-webkit-scrollbar{width:8px;height:8px}
.code::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:8px}

/* ===== التذييل ===== */
.footer{
  position:relative;padding:70px 24px 50px;text-align:center;
  overflow:hidden;border-top:1px solid var(--stroke);margin-top:40px;
}
.footer::before{
  content:"B6_7E@";
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(80px,16vw,200px);
  font-weight:900;letter-spacing:-0.06em;
  background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0.06;pointer-events:none;white-space:nowrap;user-select:none;z-index:0;
}
.footer-inner{
  position:relative;z-index:1;max-width:1200px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;gap:22px;
}

/* ===== التواصل الاجتماعي ===== */
.social-wrap{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  width:100%;
}
.social-label{
  font-size:0.78rem;font-weight:700;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;
  display:flex;align-items:center;gap:12px;
}
.social-label::before,.social-label::after{
  content:"";width:40px;height:1px;
  background:linear-gradient(90deg,transparent,var(--stroke),transparent);
}
.social-label::before{background:linear-gradient(90deg,transparent,rgba(168,85,247,0.4))}
.social-label::after{background:linear-gradient(90deg,rgba(168,85,247,0.4),transparent)}
.social-grid{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:12px;max-width:640px;
}
.social-btn{
  position:relative;
  width:52px;height:52px;border-radius:16px;
  display:grid;place-items:center;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--stroke);
  color:#a5b0d0;
  text-decoration:none;cursor:pointer;
  transition:0.35s cubic-bezier(0.2,0.9,0.3,1.3);
  overflow:hidden;
  backdrop-filter:blur(10px);
}
.social-btn::before{
  content:"";position:absolute;inset:0;
  background:var(--brand-gradient);
  opacity:0;transition:0.35s;
  z-index:0;
}
.social-btn::after{
  content:"";position:absolute;inset:-2px;border-radius:18px;
  background:var(--brand-gradient);
  opacity:0;filter:blur(14px);transition:0.35s;
  z-index:-1;
}
.social-btn svg{
  width:24px;height:24px;fill:currentColor;
  position:relative;z-index:1;
  transition:0.35s;
}
.social-btn:hover{
  transform:translateY(-6px) scale(1.05);
  border-color:transparent;color:#fff;
}
.social-btn:hover::before{opacity:1}
.social-btn:hover::after{opacity:0.7}
.social-btn:hover svg{
  transform:scale(1.1);
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

/* ألوان كل منصة */
.social-btn[data-brand="whatsapp"]{--brand-gradient:linear-gradient(135deg,#25D366,#128C7E)}
.social-btn[data-brand="telegram"]{--brand-gradient:linear-gradient(135deg,#2AABEE,#229ED9)}
.social-btn[data-brand="instagram"]{--brand-gradient:linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)}
.social-btn[data-brand="twitter"]{--brand-gradient:linear-gradient(135deg,#1DA1F2,#0d8bd9)}
.social-btn[data-brand="tiktok"]{--brand-gradient:linear-gradient(135deg,#25F4EE,#000,#FE2C55)}
.social-btn[data-brand="youtube"]{--brand-gradient:linear-gradient(135deg,#FF0000,#c00)}
.social-btn[data-brand="facebook"]{--brand-gradient:linear-gradient(135deg,#1877F2,#0d5fc4)}
.social-btn[data-brand="snapchat"]{--brand-gradient:linear-gradient(135deg,#FFFC00,#FFD700)}

/* ألوان الأيقونات الأصلية قبل المرور */
.social-btn[data-brand="whatsapp"] svg{color:#25D366}
.social-btn[data-brand="telegram"] svg{color:#2AABEE}
.social-btn[data-brand="instagram"] svg{color:#E4405F}
.social-btn[data-brand="twitter"] svg{color:#1DA1F2}
.social-btn[data-brand="tiktok"] svg{color:#fff}
.social-btn[data-brand="youtube"] svg{color:#FF0000}
.social-btn[data-brand="facebook"] svg{color:#1877F2}
.social-btn[data-brand="snapchat"] svg{color:#FFFC00}

.social-btn:hover svg{color:#fff}

/* ===== الهوية والحقوق ===== */
.footer-brand{
  font-size:1.5rem;font-weight:900;letter-spacing:-0.5px;
  background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(168,85,247,0.4));
}
.footer-chip{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 18px;border-radius:999px;
  background:rgba(255,255,255,0.03);border:1px solid var(--stroke);
  font-size:0.78rem;color:var(--muted);
  backdrop-filter:blur(10px);flex-wrap:wrap;justify-content:center;
}
.chip-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green1);box-shadow:0 0 12px var(--green1);
  animation:pulse 2s infinite;flex:none;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.85)}}
.chip-sep{opacity:0.4}

/* ===== التوست ===== */
#toast{
  position:fixed;bottom:30px;left:50%;
  transform:translate(-50%,30px);
  background:linear-gradient(135deg,var(--green2),var(--green1));
  color:#02110a;padding:12px 26px;border-radius:999px;
  font-weight:800;font-size:0.85rem;
  box-shadow:0 20px 40px -12px rgba(16,185,129,0.8);
  opacity:0;pointer-events:none;
  transition:0.3s cubic-bezier(0.2,0.9,0.3,1.3);
  z-index:100;white-space:nowrap;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== الاستجابة ===== */
@media(max-width:500px){
  .header{padding:14px 12px}
  .header-inner{padding:10px 14px;border-radius:14px}
  .header-badge{display:none}
  .main{padding:20px 14px 40px}
  .card{padding:18px;border-radius:18px}
  .hero{margin-bottom:24px}
  .footer{padding:50px 16px 40px}
  .social-btn{width:46px;height:46px;border-radius:14px}
  .social-btn svg{width:21px;height:21px}
  .social-grid{gap:10px}
  .social-label::before,.social-label::after{width:24px}
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="aurora"></div>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2a1 1 0 0 1 1 1v10.59l3.3-3.3a1 1 0 1 1 1.4 1.42l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.42l3.3 3.3V3a1 1 0 0 1 1-1zM4 19a1 1 0 0 1 1 1v1h14v-1a1 1 0 1 1 2 0v1.5A1.5 1.5 0 0 1 19.5 23h-15A1.5 1.5 0 0 1 3 21.5V20a1 1 0 0 1 1-1z"/></svg>
      </div>
      <span class="brand-name">Bek<span class="brand-accent">Es</span></span>
    </div>
    <div class="header-badge">iOS OTA</div>
  </div>
</header>

<main class="main">

  <div class="hero">
    <h1>مولّد روابط تثبيت تطبيقات iOS</h1>
    <p>أنشئ ملف plist ورابط تثبيت جاهز </p>
  </div>

  <div class="grid">

    <!-- النموذج -->
    <section class="card">
      <div class="card-head">
        <h2>بيانات التطبيق</h2>
        <span class="status" id="status">جاهز</span>
      </div>

      <div class="field">
        <label for="appTitle">اسم التطبيق</label>
        <input id="appTitle" type="text" placeholder="اسم التطبيق" autocomplete="off">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="bundleId">Bundle ID</label>
          <input id="bundleId" type="text" dir="ltr" placeholder="com.example.app" autocomplete="off">
        </div>
        <div class="field">
          <label for="appVersion">الإصدار</label>
          <input id="appVersion" type="text" dir="ltr" placeholder="1.0.0" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label for="ipaUrl">رابط ملف IPA</label>
        <input id="ipaUrl" type="url" dir="ltr" placeholder="https://.../app.ipa" autocomplete="off">
      </div>

      <div class="field">
        <label for="iconUrl">رابط الأيقونة (اختياري)</label>
        <input id="iconUrl" type="url" dir="ltr" placeholder="https://.../icon.png" autocomplete="off">
      </div>

      <div class="field">
        <label for="plistUrl">رابط ملف plist المستضاف</label>
        <input id="plistUrl" type="url" dir="ltr" placeholder="https://.../manifest.plist" autocomplete="off">
      </div>
    </section>

    <!-- النتيجة -->
    <aside class="card">
      <div class="card-head">
        <h2>التثبيت</h2>
      </div>

      <a id="installBtn" class="btn btn-install disabled" href="#">
        <svg viewBox="0 0 24 24"><path d="M12 3a1 1 0 0 1 1 1v9.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1zM4 18a1 1 0 0 1 1 1v1h14v-1a1 1 0 1 1 2 0v1.5A1.5 1.5 0 0 1 19.5 22h-15A1.5 1.5 0 0 1 3 20.5V19a1 1 0 0 1 1-1z"/></svg>
        تثبيت التطبيق
      </a>
      <p class="btn-hint">متوفر على iPhone و iPad</p>

      <a id="ipaBtn" class="btn btn-ipa disabled" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5L13 3.5z"/></svg>
        تحميل ملف IPA
      </a>

      <div class="divider"></div>

      <div class="link-head">

<div id="toast">تم النسخ بنجاح ✅</div>

<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);

  const els = {
    appTitle:$("appTitle"), bundleId:$("bundleId"), appVersion:$("appVersion"),
    ipaUrl:$("ipaUrl"), iconUrl:$("iconUrl"), plistUrl:$("plistUrl")
  };
  const installBtn   = $("installBtn");
  const ipaBtn       = $("ipaBtn");
  const plistCodeEl  = $("plistCode");
  const itmsInput    = $("itmsLink");
  const statusPill   = $("status");
  const copyPlistBtn = $("copyPlist");
  const dlPlistBtn   = $("downloadPlist");
  const copyItmsBtn  = $("copyItms");

  let currentPlist = "";

  const esc = (s) => String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&apos;");

  function isUrl(v){
    if(!v) return false;
    try{ const u = new URL(v); return u.protocol==="http:"||u.protocol==="https:"; }
    catch(e){ return false; }
  }

  function toast(msg){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.classList.remove("show"), 2200);
  }

  async function copyText(text){
    if(!text) return;
    try{
      await navigator.clipboard.writeText(text);
      toast("تم النسخ بنجاح ✅");
    }catch(e){
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand("copy"); toast("تم النسخ بنجاح ✅"); }
      catch(err){ toast("تعذّر النسخ"); }
      ta.remove();
    }
  }

  function buildPlist(d){
    const assets = [];
    assets.push(
`                <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>${esc(d.ipa)}</string>
                </dict>`
    );
    if(d.icon && isUrl(d.icon)){
      assets.push(
`                <dict>
                    <key>kind</key>
                    <string>display-image</string>
                    <key>url</key>
                    <string>${esc(d.icon)}</string>
                </dict>`
      );
      assets.push(
`                <dict>
                    <key>kind</key>
                    <string>full-size-image</string>
                    <key>url</key>
                    <string>${esc(d.icon)}</string>
                </dict>`
      );
    }
    return `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
 "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>items</key>
    <array>
        <dict>
            <key>assets</key>
            <array>
${assets.join("\n")}
            </array>
            <key>metadata</key>
            <dict>
                <key>bundle-identifier</key>
                <string>${esc(d.bundle)}</string>
                <key>bundle-version</key>
                <string>${esc(d.version)}</string>
                <key>kind</key>
                <string>software</string>
                <key>title</key>
                <string>${esc(d.title)}</string>
            </dict>
        </dict>
    </array>
</dict>
</plist>
`;
  }

  function render(){
    const d = {
      title:   els.appTitle.value.trim(),
      bundle:  els.bundleId.value.trim(),
      version: els.appVersion.value.trim(),
      ipa:     els.ipaUrl.value.trim(),
      icon:    els.iconUrl.value.trim(),
      plist:   els.plistUrl.value.trim()
    };

    const coreReady = d.title && d.bundle && d.version && isUrl(d.ipa);

    if(coreReady){
      currentPlist = buildPlist(d);
      plistCodeEl.textContent = currentPlist;
      copyPlistBtn.classList.remove("disabled");
      dlPlistBtn.classList.remove("disabled");
      statusPill.textContent = "الملف جاهز";
      statusPill.classList.add("ok");
    }else{
      currentPlist = "";
      plistCodeEl.textContent = "…";
      copyPlistBtn.classList.add("disabled");
      dlPlistBtn.classList.add("disabled");
      statusPill.textContent = "جاهز";
      statusPill.classList.remove("ok");
    }

    if(isUrl(d.ipa)){
      ipaBtn.href = d.ipa;
      ipaBtn.classList.remove("disabled");
    }else{
      ipaBtn.href = "#";
      ipaBtn.classList.add("disabled");
    }

    if(coreReady && isUrl(d.plist)){
      const itms = "itms-services://?action=download-manifest&url=" + encodeURIComponent(d.plist);
      installBtn.href = itms;
      installBtn.classList.remove("disabled");
      itmsInput.value = itms;
      copyItmsBtn.classList.remove("disabled");
    }else{
      installBtn.href = "#";
      installBtn.classList.add("disabled");
      itmsInput.value = "";
      copyItmsBtn.classList.add("disabled");
    }

    try{ localStorage.setItem("bekes_form", JSON.stringify(d)); }catch(e){}
  }

  function restore(){
    try{
      const raw = localStorage.getItem("bekes_form");
      if(!raw) return;
      const d = JSON.parse(raw);
      els.appTitle.value   = d.title   || "";
      els.bundleId.value   = d.bundle  || "";
      els.appVersion.value = d.version || "";
      els.ipaUrl.value     = d.ipa     || "";
      els.iconUrl.value    = d.icon    || "";
      els.plistUrl.value   = d.plist   || "";
    }catch(e){}
  }

  function downloadPlist(){
    if(!currentPlist){ toast("املأ الحقول المطلوبة أولاً"); return; }
    const blob = new Blob([currentPlist], { type:"application/xml;charset=utf-8" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = "manifest.plist";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast("تم تنزيل manifest.plist 📥");
  }

  Object.values(els).forEach((el) => {
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });

  copyPlistBtn.addEventListener("click", () => copyText(currentPlist));
  dlPlistBtn.addEventListener("click", downloadPlist);
  copyItmsBtn.addEventListener("click", () => copyText(itmsInput.value));

  installBtn.addEventListener("click", (e) => {
    if(installBtn.classList.contains("disabled")){
      e.preventDefault();
      toast("أدخل رابط ملف plist المستضاف أولاً");
    }
  });
  ipaBtn.addEventListener("click", (e) => {
    if(ipaBtn.classList.contains("disabled")){
      e.preventDefault();
      toast("أدخل رابط ملف IPA أولاً");
    }
  });

  restore();
  render();
})();
</script>
